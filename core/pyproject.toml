[project]
name = "fem1d"
version = "0.1.0"
description = "1D linear second-order BVP solver (P1/P2 finite elements)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1",
    "sympy>=1.13",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "scikit-fem>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fem1d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected from `make check`)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
